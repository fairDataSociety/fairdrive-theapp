name: Node.js CI

on:
  pull_request:
    branches:
      - '**'

env:
  REACT_APP_BEE_URL: http://localhost:1633
  NEXT_PUBLIC_BEE_URL: http://localhost:1633
  REACT_APP_BEE_DEBUG_URL: http://localhost:1635
  NEXT_PUBLIC_BEE_DEBUG_URL: http://localhost:1635
  NEXT_PUBLIC_RPC_URL: https://rpc.sepolia.org
  NEXT_PUBLIC_CONSENT_VIEWER: https://app.crviewer.dev.fairdatasociety.org
  NEXT_PUBLIC_ENS_REGISTRY_ADDRESS: '0x42a96D45d787685ac4b36292d218B106Fb39be7F'
  NEXT_PUBLIC_SUBDOMAIN_REGISTRAR_ADDRESS: '0xFBF00389140C00384d88d458239833E3231a7414'
  NEXT_PUBLIC_PUBLIC_RESOLVER_ADDRESS: '0xC904989B579c2B216A75723688C784038AA99B56'
  NEXT_PUBLIC_GLOBAL_BATCH_ID: 'b48953f094938e65f64addef4049b1f41b8140f3673053f2bb0db74b0b15f7be'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    strategy:
      matrix:
        node-version: [20.x]
        # Node 18 dropped: serialize-javascript v6+ uses globalThis.crypto which is only
        # a bare global from Node 19+. Node 20 is LTS and has it built-in. See #602 for
        # the Next.js 12→14 upgrade that will restore full Node 18 compat.

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: build
        run: npm run build
        env:
          CI: false
          # Preload crypto shim in all Node processes (including next export workers)
          # so fdp-storage's global.crypto assignment doesn't throw on Node 20+.
          NODE_OPTIONS: --require ./crypto-shim.cjs
